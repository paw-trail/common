# ─────────────────────────────────────────────────────────────
# 복제 후 아래 표시된 값을 이 서비스에 맞게 바꿉니다.
#   spring.application.name   서비스명
#   server.port               README의 포트 배정표 참고
#   spring.datasource.url     DB명
#   spring.datasource.username 서비스 전용 계정
# ─────────────────────────────────────────────────────────────
spring:
  application:
    name: template-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/template_db
    username: template_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 스키마는 Flyway가 관리합니다. 애플리케이션은 검증만 하며,
      # 엔티티와 실제 테이블이 어긋나면 기동에 실패합니다.
      # update 나 create 로 바꾸면 공용 DB의 데이터가 사라질 수 있습니다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, refresh
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      # 개발 중에는 전량 추적합니다. 부하 테스트나 배포 시에는 낮춥니다.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

app:
  auditor:
    # 인증 없이 도는 배치가 감사 컬럼에 남길 이름입니다.
    # 배치 서비스만 ingest-batch, extract-batch 등으로 바꿉니다.
    system-name: SYSTEM
  outbox:
    relay:
      # 미발행 이벤트를 회수하는 스케줄러입니다.
      # 이벤트를 발행하는 서비스에서만, 그중 한 인스턴스에서만 켭니다.
      enabled: false

logging:
  level:
    com.pawtrail: DEBUG
