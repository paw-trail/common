plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'com.pawtrail'
version = '0.0.13'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // 서비스 쪽 IDE 에서 공통 모듈 코드를 바로 열어볼 수 있게 소스도 함께 배포함
    withSourcesJar()
}

// 실행되는 서비스가 아니라 라이브러리이므로 실행 가능 jar 를 만들지 않음
// bootJar 산출물은 BOOT-INF 구조라 다른 프로젝트가 의존성으로 쓸 수 없음
tasks.named('bootJar') {
    enabled = false
}
tasks.named('jar') {
    enabled = true
    archiveClassifier = ''
}

// 테스트는 JUnit 5(Jupiter)로 돌림
// 없으면 Gradle 이 테스트를 하나도 못 찾고 빌드가 실패함
// common 에 테스트가 0개였을 때는 이 블록이 없어도 드러나지 않았음
tasks.named('test') {
    useJUnitPlatform()
}

// 서비스 쪽 service-template 의 값과 반드시 같아야 함
// 다르면 같은 lb:// 주소를 서로 다른 구현이 풀게 되어 어긋남
ext {
    set('springCloudVersion', "2025.1.3")
}

repositories {
    mavenCentral()
}

dependencies {
    // ── 자동설정 뼈대 ─────────────────────────────────────────
    compileOnly         'org.springframework.boot:spring-boot-starter'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // ── 로깅 ──────────────────────────────────────────────────
    // 아래 compileOnly 들과 달리 api 로 두어 서비스까지 전파시킴
    //
    // compileOnly 로 두는 이유는 조건부 로딩 때문인데(무상태 서비스가 JPA 를 안 물게 하려고)
    // 로깅은 17개 서비스가 예외 없이 전부 쓰므로 조건부일 이유가 없음
    //
    // XML 은 common 에 있고 의존성은 서비스에 있으면 짝이 갈리고,
    // 서비스가 빠뜨리면 logback 이 클래스를 못 찾아 appender 만 조용히 빠짐
    // 앱은 정상 기동하고 로그만 Loki 에 안 가므로 알아채기 어려움
    //
    // 2.1.0 은 logback-classic 1.6.1 을 요구하는데 Boot 4.1.1 이 물고 오는 것은 1.5.38 이라
    // 2.0 라인을 씀
    api 'com.github.loki4j:loki-logback-appender:2.0.3'

    // ── 서비스 간 호출 ────────────────────────────────────────
    // 위 로깅과 같은 이유로 api 임. 서비스까지 전파시킴
    //
    // RestClient 자체는 spring-web 에 있어 starter-webmvc 만으로 쓸 수 있으나
    // 요청 팩터리를 고르는 ClientHttpRequestFactoryBuilder 는
    // spring-boot-http-client 에 있고 그 모듈은 starter-webmvc 로 딸려오지 않음
    // spring-boot-restclient 가 그것을 api 로 물고 있어 이 한 줄이면 됨
    //
    // compileOnly 로 두면 서비스 런타임에 없어
    // CommonRestClientAutoConfiguration 이 로딩되는 순간 NoClassDefFoundError 로 죽음
    // 서비스마다 한 줄씩 넣게 하면 빠뜨린 서비스가 기동에서 죽고, 그 줄이 17개로 늘어남
    api 'org.springframework.boot:spring-boot-restclient'

    // ── 아래는 전부 compileOnly 임 ────────────────────────────
    // implementation 으로 두면 공통 모듈을 쓰는 순간 JPA 와 Kafka 가 함께 딸려 들어와
    // 조건부 로딩을 해둔 의미가 사라짐
    // 실제 스타터는 각 서비스가 직접 선언함
    compileOnly 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-redis'
    compileOnly 'org.springframework.boot:spring-boot-starter-kafka'
    // TraceIdResponseAdvice 가 Tracer 타입만 참조함
    // 실제 Tracer 빈은 각 서비스의 spring-boot-starter-zipkin 이 만듦
    compileOnly 'io.micrometer:micrometer-tracing'
    compileOnly 'org.springframework.data:spring-data-commons'
    // @LoadBalanced 애노테이션과 lb:// 주소 해석에 필요함
    // 실제 유레카 연동은 각 서비스의 spring-cloud-starter-netflix-eureka-client 가 함
    //
    // 플랫폼 3개(gateway·eureka·config-server)는 common 을 안 쓰므로 무관하고,
    // 무상태 서비스가 common 을 받아도 이 의존성이 딸려 오지 않음
    compileOnly 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    // ── QueryDSL ──────────────────────────────────────────────
    // BaseEntity 의 Q 클래스를 만들어 jar 에 담기 위한 것임
    //
    // * 왜 필요한가
    //   서비스의 엔티티가 BaseEntity 를 상속하면 그쪽 QueryDSL 이 QXxx 를 만드는데
    //   그 코드가 com.pawtrail.common.entity.QBaseEntity 를 참조함
    //   이 프로세서가 없으면 그 클래스가 jar 에 없어 서비스 컴파일이 깨짐
    //     QAccount.java: cannot find symbol - class QBaseEntity
    //
    // * 조건부 로딩과 무관함
    //   위 compileOnly 들과 달리 이것은 컴파일 시점에만 도는 프로세서이고
    //   결과물인 QBaseEntity.class 는 아무 빈도 만들지 않는 값 객체임
    //   무상태 서비스가 받아도 쓰지 않으면 그만이라 해롭지 않음
    //
    // * groupId 가 io.github.openfeign.querydsl 인 것에 주의할 것
    //   원래의 com.querydsl 은 유지보수가 멈춰 이 포크로 갈아탔음
    //   서비스 쪽과 같은 좌표여야 생성된 Q 클래스가 서로 맞물림
    //   패키지명은 com.querydsl 그대로임
    compileOnly         "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"

    // ── Lombok ────────────────────────────────────────────────
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ── 테스트 ────────────────────────────────────────────────
    // compileOnly 는 테스트 컴파일에 걸리지 않으므로 같은 의존성을 다시 선언함
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation 'io.micrometer:micrometer-tracing'
    testImplementation 'org.springframework.data:spring-data-commons'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    testImplementation      "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    testCompileOnly         'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// spring-cloud-starter-loadbalancer 의 버전이 여기서 옴
// Spring Cloud 는 Boot 와 릴리스 주기가 달라 BOM 으로 맞춰야 함
//
// 이 블록이 없으면 위 의존성에 버전이 없어 해석에 실패함
// service-template 에는 있었으나 common 에는 없었고,
// common 이 서비스 간 호출 기반을 갖게 되면서 처음 필요해졌음
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

publishing {
    publications {
        common(MavenPublication) {
            from components.java
            artifactId = 'common'
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/paw-trail/common')
            credentials {
                username = System.getenv('GPR_USER')
                password = System.getenv('GPR_TOKEN')
            }
        }
    }
}
