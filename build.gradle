plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'com.pawtrail'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // 서비스 쪽 IDE에서 공통 모듈 코드를 바로 열어볼 수 있게 소스도 함께 배포합니다.
    withSourcesJar()
}

// 실행되는 서비스가 아니라 라이브러리이므로 실행 가능 jar를 만들지 않습니다.
// bootJar 산출물은 BOOT-INF 구조라 다른 프로젝트가 의존성으로 쓸 수 없습니다.
tasks.named('bootJar') {
    enabled = false
}
tasks.named('jar') {
    enabled = true
    archiveClassifier = ''
}

repositories {
    mavenCentral()
}

dependencies {
    // ── 자동설정 뼈대 ─────────────────────────────────────────
    compileOnly         'org.springframework.boot:spring-boot-starter'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // ── 아래는 전부 compileOnly 입니다 ────────────────────────
    // implementation 으로 두면 공통 모듈을 쓰는 순간 JPA와 Kafka가 함께 딸려 들어와
    // 조건부 로딩을 해둔 의미가 사라집니다. 실제 스타터는 각 서비스가 직접 선언합니다.
    compileOnly 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-redis'
    compileOnly 'org.springframework.boot:spring-boot-starter-kafka'
    // TraceIdResponseAdvice가 Tracer 타입만 참조합니다.
    // (실제 Tracer 빈은 각 서비스의 spring-boot-starter-zipkin이 만듭니다.)
    compileOnly 'io.micrometer:micrometer-tracing'
    compileOnly 'org.springframework.data:spring-data-commons'

    // ── Lombok ────────────────────────────────────────────────
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ── 테스트 ────────────────────────────────────────────────
    // compileOnly 는 테스트 컴파일에 걸리지 않으므로 같은 의존성을 다시 선언합니다.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation 'io.micrometer:micrometer-tracing'
    testImplementation 'org.springframework.data:spring-data-commons'
    testCompileOnly         'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

publishing {
    publications {
        common(MavenPublication) {
            from components.java
            artifactId = 'common'
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/paw-trail/common')
            credentials {
                username = System.getenv('GPR_USER')
                password = System.getenv('GPR_TOKEN')
            }
        }
    }
}
